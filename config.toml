# Codex 个人全局配置（无密钥）
# bootstrap.sh 会合并 mcp/user-servers.toml 后写入 ~/.codex/config.toml

model = "gpt-5.5"
model_provider = "auto-code"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[model_providers.auto-code]
name = "Auto-Code"
base_url = "https://vip.auto-code.net/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
requires_openai_auth = false
